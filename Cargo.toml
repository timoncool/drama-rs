[package]
name = "drama-rs"
version = "0.1.0"
edition = "2021"
description = "Fish Audio Drama 3 text-to-speech on a single 24 GB GPU (Rust + CUDA)"
license = "Apache-2.0"
repository = "https://github.com/apiplant/drama-rs"
homepage = "https://drama-rs.apiplant.com"
readme = "README.md"
keywords = ["text-to-speech", "tts", "cuda", "fish-audio", "voice-cloning"]
categories = ["multimedia::audio", "science", "command-line-utilities"]
# the crate is the engine, its CUDA kernels and the binary; weights are downloaded separately
include = ["/src/", "/kernels/", "/build.rs", "/README.md", "/LICENSE"]

[lib]
name = "drama"

[features]
default = ["cli"]
# the `drama` command-line binary (clap). Disable default features to use drama as a library
cli = ["dep:clap"]
# NVIDIA CUDA backend: compiles kernels/*.cu with nvcc and links cudart/cublas.
# Required for actual inference; off by default so the crate also builds where there
# is no CUDA toolkit (e.g. Apple Silicon, the target of the MLX port in docs/MLX-PORT.md).
cuda = []
# Apple-Silicon backend: Metal device memory, command queues and hand-written MSL
# kernels + CPU reference implementations (see docs/MLX-PORT.md). Mutually exclusive
# with `cuda`.
metal = ["dep:metal"]

[[bin]]
name = "drama"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
half = "2"
hound = "3.5"
memmap2 = "0.9"
metal = { version = "0.33", optional = true }
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[profile.release]
debug = 1

# release archives and packages: no debug info (`release` keeps it for profiling)
[profile.dist]
inherits = "release"
debug = 0
strip = true
